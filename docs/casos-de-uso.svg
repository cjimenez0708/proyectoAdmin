<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="1100" height="800" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#12396b">Diagrama de casos de uso · Herramienta de implementación Spa Visual</text>

  <!-- Límite del sistema -->
  <rect x="250" y="60" width="600" height="720" rx="14" fill="#f4f9fc" stroke="#12396b" stroke-width="2"/>
  <text x="550" y="86" text-anchor="middle" font-weight="700" fill="#12396b">Sistema: Spa Visual (aplicación web)</text>

  <!-- Actores -->
  <g id="actor-duena" stroke="#12396b" stroke-width="2" fill="none">
    <circle cx="110" cy="250" r="18"/>
    <line x1="110" y1="268" x2="110" y2="320"/>
    <line x1="75" y1="288" x2="145" y2="288"/>
    <line x1="110" y1="320" x2="82" y2="360"/>
    <line x1="110" y1="320" x2="138" y2="360"/>
  </g>
  <text x="110" y="384" text-anchor="middle" font-weight="600" fill="#1b2433">Optometrista y dueña</text>
  <text x="110" y="402" text-anchor="middle" font-size="12" fill="#5d6b7e">(responsable de la aplicación)</text>

  <g id="actor-secretaria" stroke="#12396b" stroke-width="2" fill="none">
    <circle cx="990" cy="250" r="18"/>
    <line x1="990" y1="268" x2="990" y2="320"/>
    <line x1="955" y1="288" x2="1025" y2="288"/>
    <line x1="990" y1="320" x2="962" y2="360"/>
    <line x1="990" y1="320" x2="1018" y2="360"/>
  </g>
  <text x="990" y="384" text-anchor="middle" font-weight="600" fill="#1b2433">Secretaria</text>
  <text x="990" y="402" text-anchor="middle" font-size="12" fill="#5d6b7e">(recopila evidencia y</text>
  <text x="990" y="418" text-anchor="middle" font-size="12" fill="#5d6b7e">registra indicadores)</text>

  <g id="actor-firebase" stroke="#5d6b7e" stroke-width="2" fill="none">
    <rect x="955" y="640" width="70" height="44" rx="6"/>
  </g>
  <text x="990" y="667" text-anchor="middle" font-size="12" fill="#5d6b7e">«sistema»</text>
  <text x="990" y="704" text-anchor="middle" font-weight="600" fill="#1b2433">Firebase</text>
  <text x="990" y="720" text-anchor="middle" font-size="12" fill="#5d6b7e">(Auth + Firestore)</text>

  <!-- Casos de uso -->
  <g fill="#ffffff" stroke="#1aa3c8" stroke-width="2">
    <ellipse cx="550" cy="130" rx="150" ry="26"/>
    <ellipse cx="550" cy="196" rx="170" ry="26"/>
    <ellipse cx="450" cy="262" rx="150" ry="26"/>
    <ellipse cx="680" cy="330" rx="150" ry="26"/>
    <ellipse cx="450" cy="398" rx="160" ry="26"/>
    <ellipse cx="550" cy="464" rx="180" ry="26"/>
    <ellipse cx="550" cy="530" rx="170" ry="26"/>
    <ellipse cx="550" cy="596" rx="170" ry="26"/>
    <ellipse cx="550" cy="662" rx="170" ry="26"/>
    <ellipse cx="550" cy="728" rx="190" ry="26"/>
  </g>
  <g text-anchor="middle" fill="#1b2433">
    <text x="550" y="135">CU-01 Iniciar sesión</text>
    <text x="550" y="201">CU-02 Crear aplicación de verificación</text>
    <text x="450" y="267">CU-03 Calificar enunciado</text>
    <text x="680" y="335">CU-04 Registrar evidencia</text>
    <text x="450" y="403">CU-05 Registrar acción correctiva</text>
    <text x="550" y="469">CU-06 Consultar cumplimiento y nivel</text>
    <text x="550" y="535">CU-07 Consultar plan de trabajo</text>
    <text x="550" y="601">CU-08 Registrar indicadores del mes</text>
    <text x="550" y="667">CU-09 Consultar indicadores y alertas</text>
    <text x="550" y="733">CU-10 Consultar información del proyecto</text>
  </g>

  <!-- Relaciones include / extend -->
  <g stroke="#5d6b7e" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#flecha)">
    <path d="M 450 372 L 450 290"/>
    <path d="M 600 252 L 650 304"/>
  </g>
  <text x="458" y="336" font-size="12" fill="#5d6b7e">«extend»</text>
  <text x="458" y="350" font-size="11" fill="#5d6b7e">[estado = No cumple]</text>
  <text x="640" y="268" font-size="12" fill="#5d6b7e">«include»</text>

  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6b7e"/>
    </marker>
  </defs>

  <!-- Asociaciones dueña -->
  <g stroke="#12396b" stroke-width="1.4">
    <line x1="140" y1="290" x2="400" y2="130"/>
    <line x1="140" y1="292" x2="380" y2="196"/>
    <line x1="145" y1="294" x2="300" y2="262"/>
    <line x1="145" y1="298" x2="530" y2="330"/>
    <line x1="145" y1="300" x2="290" y2="398"/>
    <line x1="140" y1="304" x2="370" y2="464"/>
    <line x1="138" y1="308" x2="380" y2="530"/>
    <line x1="135" y1="312" x2="380" y2="596"/>
    <line x1="132" y1="316" x2="380" y2="662"/>
    <line x1="128" y1="320" x2="360" y2="728"/>
  </g>

  <!-- Asociaciones secretaria -->
  <g stroke="#1aa3c8" stroke-width="1.4">
    <line x1="960" y1="290" x2="700" y2="130"/>
    <line x1="955" y1="298" x2="830" y2="330"/>
    <line x1="960" y1="304" x2="730" y2="464"/>
    <line x1="962" y1="310" x2="720" y2="596"/>
    <line x1="965" y1="316" x2="720" y2="662"/>
    <line x1="968" y1="320" x2="740" y2="728"/>
  </g>

  <!-- Firebase -->
  <g stroke="#5d6b7e" stroke-width="1.2" stroke-dasharray="2 3">
    <line x1="955" y1="650" x2="700" y2="130"/>
    <line x1="955" y1="662" x2="720" y2="596"/>
  </g>

  <text x="550" y="795" text-anchor="middle" font-size="11" fill="#5d6b7e">Basado en los apartados 17.1, 19.2 y 19.3: la herramienta la aplica la optometrista y dueña con apoyo de la secretaria para recopilar evidencia.</text>
</svg>
