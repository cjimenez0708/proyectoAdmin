<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="1100" height="900" fill="#ffffff"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6b7e"/>
    </marker>
  </defs>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#12396b">Diagrama de casos de uso · Spa Visual</text>

  <!-- Límite del sistema -->
  <rect x="250" y="60" width="600" height="790" rx="14" fill="#f4f9fc" stroke="#12396b" stroke-width="2"/>
  <text x="550" y="88" text-anchor="middle" font-weight="700" fill="#12396b">Sistema: Spa Visual (aplicación web)</text>

  <!-- Actor: Optometrista y dueña -->
  <g stroke="#12396b" stroke-width="2" fill="none">
    <circle cx="110" cy="390" r="18"/>
    <line x1="110" y1="408" x2="110" y2="460"/>
    <line x1="75" y1="428" x2="145" y2="428"/>
    <line x1="110" y1="460" x2="82" y2="500"/>
    <line x1="110" y1="460" x2="138" y2="500"/>
  </g>
  <text x="110" y="524" text-anchor="middle" font-weight="600" fill="#1b2433">Optometrista y dueña</text>
  <text x="110" y="542" text-anchor="middle" font-size="12" fill="#5d6b7e">(responsable de la</text>
  <text x="110" y="558" text-anchor="middle" font-size="12" fill="#5d6b7e">verificación y revisión)</text>

  <!-- Actor: Secretaria -->
  <g stroke="#12396b" stroke-width="2" fill="none">
    <circle cx="990" cy="390" r="18"/>
    <line x1="990" y1="408" x2="990" y2="460"/>
    <line x1="955" y1="428" x2="1025" y2="428"/>
    <line x1="990" y1="460" x2="962" y2="500"/>
    <line x1="990" y1="460" x2="1018" y2="500"/>
  </g>
  <text x="990" y="524" text-anchor="middle" font-weight="600" fill="#1b2433">Secretaria</text>
  <text x="990" y="542" text-anchor="middle" font-size="12" fill="#5d6b7e">(recopila evidencia y</text>
  <text x="990" y="558" text-anchor="middle" font-size="12" fill="#5d6b7e">registra indicadores)</text>

  <!-- Actor sistema: Firebase -->
  <rect x="955" y="90" width="70" height="44" rx="6" fill="none" stroke="#5d6b7e" stroke-width="2"/>
  <text x="990" y="117" text-anchor="middle" font-size="12" fill="#5d6b7e">«sistema»</text>
  <text x="990" y="154" text-anchor="middle" font-weight="600" fill="#1b2433">Firebase</text>
  <text x="990" y="170" text-anchor="middle" font-size="12" fill="#5d6b7e">(Auth + Firestore)</text>

  <!-- Casos de uso -->
  <g fill="#ffffff" stroke="#1aa3c8" stroke-width="2">
    <ellipse cx="550" cy="130" rx="150" ry="25"/>
    <ellipse cx="550" cy="196" rx="170" ry="25"/>
    <ellipse cx="550" cy="262" rx="170" ry="25"/>
    <ellipse cx="450" cy="328" rx="150" ry="25"/>
    <ellipse cx="680" cy="396" rx="150" ry="25"/>
    <ellipse cx="450" cy="464" rx="165" ry="25"/>
    <ellipse cx="550" cy="530" rx="185" ry="25"/>
    <ellipse cx="550" cy="596" rx="170" ry="25"/>
    <ellipse cx="550" cy="662" rx="175" ry="25"/>
    <ellipse cx="550" cy="728" rx="180" ry="25"/>
    <ellipse cx="550" cy="794" rx="195" ry="25"/>
  </g>
  <g text-anchor="middle" fill="#1b2433">
    <text x="550" y="135">CU-01 Iniciar sesión</text>
    <text x="550" y="201">CU-02 Crear usuario (nombre, puesto)</text>
    <text x="550" y="267">CU-03 Crear verificación</text>
    <text x="450" y="333">CU-04 Calificar requisito</text>
    <text x="680" y="401">CU-05 Registrar evidencia</text>
    <text x="450" y="469">CU-06 Registrar acción correctiva</text>
    <text x="550" y="535">CU-07 Consultar cumplimiento y nivel</text>
    <text x="550" y="601">CU-08 Consultar plan de trabajo</text>
    <text x="550" y="667">CU-09 Registrar indicadores del mes</text>
    <text x="550" y="733">CU-10 Consultar indicadores y alertas</text>
    <text x="550" y="799">CU-11 Consultar información del proyecto</text>
  </g>

  <!-- include / extend -->
  <g stroke="#5d6b7e" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#flecha)">
    <path d="M 450 439 L 450 354"/>
    <path d="M 570 346 L 620 372"/>
  </g>
  <text x="458" y="392" font-size="12" fill="#5d6b7e">«extend»</text>
  <text x="458" y="406" font-size="11" fill="#5d6b7e">[estado = No cumple]</text>
  <text x="612" y="352" font-size="12" fill="#5d6b7e">«include»</text>

  <!-- Asociaciones: Optometrista y dueña (todos los casos) -->
  <g stroke="#12396b" stroke-width="1.4">
    <line x1="140" y1="420" x2="400" y2="130"/>
    <line x1="140" y1="422" x2="400" y2="196"/>
    <line x1="142" y1="424" x2="380" y2="262"/>
    <line x1="145" y1="426" x2="300" y2="328"/>
    <line x1="145" y1="430" x2="530" y2="396"/>
    <line x1="145" y1="434" x2="285" y2="464"/>
    <line x1="142" y1="438" x2="365" y2="530"/>
    <line x1="140" y1="442" x2="380" y2="596"/>
    <line x1="138" y1="446" x2="375" y2="662"/>
    <line x1="134" y1="450" x2="370" y2="728"/>
    <line x1="130" y1="454" x2="355" y2="794"/>
  </g>

  <!-- Asociaciones: Secretaria -->
  <g stroke="#1aa3c8" stroke-width="1.4">
    <line x1="960" y1="420" x2="700" y2="130"/>
    <line x1="960" y1="422" x2="700" y2="196"/>
    <line x1="955" y1="428" x2="830" y2="396"/>
    <line x1="958" y1="436" x2="735" y2="530"/>
    <line x1="960" y1="442" x2="725" y2="662"/>
    <line x1="964" y1="448" x2="730" y2="728"/>
    <line x1="968" y1="454" x2="745" y2="794"/>
  </g>

  <!-- Firebase (autenticación y almacenamiento) -->
  <g stroke="#5d6b7e" stroke-width="1.2" stroke-dasharray="2 3">
    <line x1="955" y1="112" x2="700" y2="130"/>
    <line x1="955" y1="124" x2="700" y2="196"/>
  </g>

  <text x="550" y="878" text-anchor="middle" font-size="11" fill="#5d6b7e">La verificación la realiza la optometrista y dueña con apoyo de la secretaria. Ambas ingresan con usuario y contraseña y tienen el mismo acceso.</text>
</svg>
